<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1c1912" />
      <stop offset="50%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#FFD54F" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#554010" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="4" opacity="0.6" />

  <!-- Inner Ornamental Diamond Ring -->
  <circle cx="256" cy="230" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.3" stroke-dasharray="8 6" />

  <!-- Crown / Luxury Crest -->
  <path d="M196 150 L220 180 L256 140 L292 180 L316 150 L304 195 L208 195 Z" fill="url(#goldGrad)" filter="url(#goldGlow)" />
  <circle cx="196" cy="144" r="5" fill="#FFE082" />
  <circle cx="256" cy="134" r="6" fill="#FFE082" />
  <circle cx="316" cy="144" r="5" fill="#FFE082" />

  <!-- Stylized Monogram W -->
  <path d="M140 210 L185 340 L230 250 L256 300 L282 250 L327 340 L372 210" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="22" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#goldGlow)" />

  <!-- Brand Typography -->
  <text x="256" y="405" font-family="'Cairo', 'Montserrat', sans-serif" font-size="34" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">WAKNOVA</text>
  <text x="256" y="438" font-family="'Cairo', sans-serif" font-size="16" font-weight="700" fill="#a1a1aa" text-anchor="middle" letter-spacing="1">الوكالة الحديثة للهواتف</text>
</svg>
